<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weighted Daily Tracker</title>
    <meta
      name="description"
      content="Weighted vest progress tracker for a 12-week pull, push, squat program."
    />
    <style>
      html, body, #root {
        margin: 0;
        min-height: 100%;
        background: #14140f;
      }

      body {
        font-family: "Work Sans", sans-serif;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 24px 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <script>
      const { useState, useEffect, useMemo } = React;

      function IconChevronLeft({ size = 16, color = "currentColor" }) {
        return React.createElement(
          "svg",
          { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", "aria-hidden": "true" },
          React.createElement("path", { d: "m15 18-6-6 6-6" })
        );
      }

      function IconChevronRight({ size = 16, color = "currentColor" }) {
        return React.createElement(
          "svg",
          { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", "aria-hidden": "true" },
          React.createElement("path", { d: "m9 18 6-6-6-6" })
        );
      }

      function IconFlame({ size = 12, color = "currentColor" }) {
        return React.createElement(
          "svg",
          { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", "aria-hidden": "true" },
          React.createElement("path", { d: "M12 2c1.8 2.2 3.7 4.1 3.7 7.1A4.2 4.2 0 0 1 8.3 9c0-2.8 1.5-4.7 3.7-7.1Z" }),
          React.createElement("path", { d: "M12 11c2.5 0 4.5 2 4.5 4.5A4.5 4.5 0 1 1 7.5 15.5C7.5 13 9.5 11 12 11Z" })
        );
      }

      function IconRotateCcw({ size = 16, color = "currentColor" }) {
        return React.createElement(
          "svg",
          { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", "aria-hidden": "true" },
          React.createElement("path", { d: "M3 12a9 9 0 1 0 3-6.7L3 4v5h5" }),
          React.createElement("path", { d: "M3 12v-1" })
        );
      }

      function IconDumbbell({ size = 20, color = "currentColor" }) {
        return React.createElement(
          "svg",
          { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", "aria-hidden": "true" },
          React.createElement("path", { d: "M4 9v6M20 9v6M8 7h8v10H8zM8 12h-4M20 12h4" })
        );
      }

      if (!window.storage) {
        window.storage = {
          async get(key) {
            const value = localStorage.getItem(key);
            return value ? { value } : null;
          },
          async set(key, value) {
            localStorage.setItem(key, value);
            return true;
          },
        };
      }

      const BASELINE = { pull: 9, push: 27, squat: 35 };

      const WEEK_CONFIG = {
        1: { pull: [6, 4], push: [6, 12], squat: [6, 15], band: [3, 15] },
        2: { pull: [6, 4], push: [6, 12], squat: [6, 15], band: [3, 15] },
        3: { pull: [6, 5], push: [6, 13], squat: [6, 16], band: [3, 16] },
        4: { pull: [6, 5], push: [6, 13], squat: [6, 16], band: [3, 16] },
        5: { pull: [6, 5], push: [6, 15], squat: [6, 19], band: [3, 18] },
        6: { pull: [6, 5], push: [6, 15], squat: [6, 19], band: [3, 18] },
        7: { pull: [6, 6], push: [6, 17], squat: [6, 21], band: [4, 18] },
        8: { pull: [6, 6], push: [6, 17], squat: [6, 21], band: [4, 18] },
        9: { pull: [5, 6], push: [5, 18], squat: [5, 22], band: [4, 18] },
        10: { pull: [5, 6], push: [5, 18], squat: [5, 22], band: [4, 18] },
        11: { pull: [5, 7], push: [5, 20], squat: [5, 24], band: [3, 18] },
      };

      const PHASES = [
        { label: "Phase 1: Foundation", weeks: [1, 2, 3, 4] },
        { label: "Phase 2: Overload", weeks: [5, 6, 7, 8] },
        { label: "Phase 3: Peak & Retest", weeks: [9, 10, 11, 12] },
      ];

      function phaseForWeek(week) {
        return PHASES.find((p) => p.weeks.includes(week))?.label || "";
      }

      function buildProgram() {
        const days = [];
        for (let week = 1; week <= 12; week++) {
          for (let d = 1; d <= 7; d++) {
            const dayNum = (week - 1) * 7 + d;
            const phase = phaseForWeek(week);

            if (week === 12) {
              let entry;
              if (d <= 3) {
                entry = {
                  day: dayNum, week, phase, type: "taper",
                  pull: { sets: 3, reps: 5 }, push: { sets: 3, reps: 5 }, squat: { sets: 3, reps: 5 },
                  band: null,
                };
              } else if (d <= 5) {
                entry = { day: dayNum, week, phase, type: "rest" };
              } else if (d === 6) {
                entry = { day: dayNum, week, phase, type: "retest" };
              } else {
                entry = { day: dayNum, week, phase, type: "rest" };
              }
              days.push(entry);
              continue;
            }

            if (d === 7) {
              days.push({ day: dayNum, week, phase, type: "rest" });
              continue;
            }

            const cfg = WEEK_CONFIG[week];
            const isBandDay = d % 2 === 1;
            days.push({
              day: dayNum, week, phase, type: "train",
              pull: { sets: cfg.pull[0], reps: cfg.pull[1] },
              push: { sets: cfg.push[0], reps: cfg.push[1] },
              squat: { sets: cfg.squat[0], reps: cfg.squat[1] },
              band: isBandDay ? { sets: cfg.band[0], reps: cfg.band[1] } : null,
            });
          }
        }
        return days;
      }

      const PROGRAM = buildProgram();

      const PROGRAM_RULES = [
        "Every set is submaximal — stop 3-4 reps short of failure, always. This program only works if you stay fresh; if you're grinding, you're doing it wrong.",
        "If a set starts requiring real effort to finish, drop 1-2 reps rather than push through it.",
        "Train 6 days/week with 1 fixed rest day (pick one, e.g. Sunday, and keep it consistent).",
        "Band lateral raises only go on alternating training days (3x/week), not daily — shoulders need more recovery than the compound lifts do from GTG dosing.",
        "Between sets: ~90s for pull-ups/squats, ~75s for push-ups, ~45s for band raises (the tracker's timer defaults match this) — but these are a starting point, not fixed law.",
        "Reps/sets step up roughly every 2 weeks per the program table — don't freelance additional volume on top of what's scheduled.",
        "Deload happens automatically at week 12's taper (lighter sets, fewer days) — don't skip it even if you're feeling strong.",
        "The vest adds real daily stress to elbows, wrists, and knees that bodyweight GTG doesn't have. Ache that builds day over day — not just normal training fatigue — means take an unscheduled rest day or drop back to a lighter week's numbers.",
        "Joint soreness always overrides the schedule. The plan is a framework, your joints are the final authority.",
        "Week 12: 3 taper days → 2 full rest days → one all-out retest for max reps @10kg on each movement. Don't test tired, and don't test without the rest days first — that's where the real number comes from."
      ];

      function isDayComplete(dayObj, prog) {
        if (!dayObj) return false;
        if (dayObj.type === "rest") return true;
        if (dayObj.type === "retest") return !!(prog && prog.retestDone);
        const p = prog || {};
        const checks = [["pull", dayObj.pull], ["push", dayObj.push], ["squat", dayObj.squat]];
        if (dayObj.band) checks.push(["band", dayObj.band]);
        return checks.every(([key, target]) => {
          const sets = p[key] || [];
          return Array.isArray(sets) && sets.length === target.sets && sets.every(r => r > 0);
        });
      }

      function RepInput({ label, target, reps, onChange }) {
        const setReps = Array.isArray(reps) ? reps : Array(target.sets).fill(0);
        const totalReps = setReps.reduce((sum, r) => sum + r, 0);
        const targetTotal = target.sets * target.reps;
        
        return React.createElement(
          "div",
          { style: { marginBottom: 14 } },
          React.createElement(
            "div",
            { style: { display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 } },
            React.createElement(
              "span",
              { style: { fontFamily: "'Oswald', sans-serif", fontSize: 15, letterSpacing: 1, textTransform: "uppercase", color: "#EDEAE0" } },
              label
            ),
            React.createElement(
              "span",
              { style: { fontFamily: "'JetBrains Mono', monospace", fontSize: 13, color: "#9C978A" } },
              `${target.sets}×${target.reps}`
            )
          ),
          React.createElement(
            "div",
            { style: { display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" } },
            Array.from({ length: target.sets }, (_, i) =>
              React.createElement("input", {
                key: i,
                type: "number",
                min: "0",
                value: setReps[i],
                onChange: (e) => {
                  const newArray = [...setReps];
                  newArray[i] = parseInt(e.target.value, 10) || 0;
                  onChange(newArray);
                },
                style: {
                  width: 50,
                  background: "#1F1E17",
                  border: setReps[i] > 0 ? "2px solid #8FA24C" : "1px solid #4A4832",
                  borderRadius: 4,
                  color: "#EDEAE0",
                  padding: "6px 6px",
                  fontFamily: "'JetBrains Mono', monospace",
                  fontSize: 14,
                  textAlign: "center",
                },
                placeholder: target.reps.toString(),
              })
            ),
            React.createElement(
              "span",
              { style: { fontFamily: "'JetBrains Mono', monospace", fontSize: 13, color: "#9C978A", marginLeft: 4 } },
              `${totalReps} / ${targetTotal}`
            )
          )
        );
      }

      function VestTracker() {
        const [currentDay, setCurrentDay] = useState(1);
        const [progressAll, setProgressAll] = useState({});
        const [loading, setLoading] = useState(true);
        const [retestInputs, setRetestInputs] = useState({ pull: "", push: "", squat: "" });
        const [saveError, setSaveError] = useState(false);
        const [noteInput, setNoteInput] = useState("");
        const [timerSeconds, setTimerSeconds] = useState(90);
        const [timerRunning, setTimerRunning] = useState(false);

        useEffect(() => {
          async function load() {
            try {
              const meta = await window.storage.get("meta");
              if (meta && meta.value) setCurrentDay(JSON.parse(meta.value).currentDay || 1);
            } catch (e) {}
            try {
              const prog = await window.storage.get("progress-all");
              if (prog && prog.value) setProgressAll(JSON.parse(prog.value));
            } catch (e) {}
            setLoading(false);
          }
          load();
        }, []);

        useEffect(() => {
          let interval;
          if (timerRunning && timerSeconds > 0) {
            interval = setInterval(() => {
              setTimerSeconds((prev) => prev - 1);
            }, 1000);
          } else if (timerSeconds === 0) {
            setTimerRunning(false);
          }
          return () => clearInterval(interval);
        }, [timerRunning, timerSeconds]);

        async function persistProgress(next) {
          setProgressAll(next);
          try {
            const res = await window.storage.set("progress-all", JSON.stringify(next));
            setSaveError(!res);
          } catch (e) {
            setSaveError(true);
          }
        }

        async function persistMeta(day) {
          setCurrentDay(day);
          try {
            await window.storage.set("meta", JSON.stringify({ currentDay: day }));
          } catch (e) {}
        }

        const dayObj = useMemo(() => PROGRAM.find((d) => d.day === currentDay), [currentDay]);
        const dayProg = progressAll[currentDay] || {};

        useEffect(() => {
          setNoteInput(dayProg.note || "");
        }, [currentDay, dayProg.note]);

        function setReps(exerciseKey, repsArray) {
          const nextDay = { ...dayProg, [exerciseKey]: repsArray };
          persistProgress({ ...progressAll, [currentDay]: nextDay });
        }

        function saveNote() {
          const nextDay = { ...dayProg, note: noteInput };
          persistProgress({ ...progressAll, [currentDay]: nextDay });
        }

        function saveRetest() {
          const pull = parseInt(retestInputs.pull, 10);
          const push = parseInt(retestInputs.push, 10);
          const squat = parseInt(retestInputs.squat, 10);
          if (!pull || !push || !squat) return;
          const nextDay = { ...dayProg, retestDone: true, retestPull: pull, retestPush: push, retestSquat: squat };
          persistProgress({ ...progressAll, [currentDay]: nextDay });
        }

        function resetAll() {
          persistProgress({});
          persistMeta(1);
        }

        const week = dayObj?.week || 1;
        const weekDayIndex = ((currentDay - 1) % 7) + 1;
        const weekStartDay = (week - 1) * 7 + 1;

        const totalTrainDays = PROGRAM.filter((d) => d.type !== "rest").length;
        const completedTrainDays = PROGRAM.filter((d) => d.type !== "rest" && isDayComplete(d, progressAll[d.day])).length;

        let streak = 0;
        for (let d = currentDay; d >= 1; d--) {
          const obj = PROGRAM.find((x) => x.day === d);
          if (isDayComplete(obj, progressAll[d])) streak++;
          else break;
        }

        if (loading) {
          return React.createElement(
            "div",
            { style: { padding: 40, textAlign: "center", color: "#9C978A", fontFamily: "sans-serif" } },
            "Loading program..."
          );
        }

        return React.createElement(
          "div",
          {
            style: {
              background: "#14140F",
              color: "#EDEAE0",
              padding: 20,
              borderRadius: 8,
              maxWidth: 480,
              margin: "0 auto",
              fontFamily: "'Work Sans', sans-serif",
            },
          },
          React.createElement("style", null, `
            @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Work+Sans:wght@400;500&family=JetBrains+Mono:wght@400;600&display=swap');
          `),
          React.createElement(
            "div",
            { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 } },
            React.createElement(
              "div",
              { style: { display: "flex", alignItems: "center", gap: 8 } },
              React.createElement(IconDumbbell, { size: 20, color: "#8FA24C" }),
              React.createElement(
                "span",
                { style: { fontFamily: "'Oswald', sans-serif", fontSize: 18, letterSpacing: 1, textTransform: "uppercase" } },
                "Weighted Daily"
              )
            ),
            React.createElement(
              "button",
              {
                onClick: resetAll,
                title: "Reset all progress",
                style: { background: "none", border: "none", color: "#9C978A", cursor: "pointer", display: "flex", alignItems: "center" },
              },
              React.createElement(IconRotateCcw, { size: 16, color: "#9C978A" })
            )
          ),
          React.createElement(
            "div",
            { style: { display: "flex", gap: 3, marginBottom: 4 } },
            Array.from({ length: 12 }, (_, i) => i + 1).map((w) =>
              React.createElement("div", {
                key: w,
                style: {
                  flex: 1,
                  height: 6,
                  borderRadius: 3,
                  background: w < week ? "#8FA24C" : w === week ? "#C1602E" : "#2A2920",
                },
              })
            )
          ),
          React.createElement(
            "div",
            { style: { fontSize: 12, color: "#9C978A", marginBottom: 18, fontFamily: "'JetBrains Mono', monospace" } },
            `WEEK ${week} / 12 · ${dayObj?.phase}`
          ),
          React.createElement(
            "div",
            { style: { display: "flex", gap: 6, marginBottom: 18 } },
            Array.from({ length: 7 }, (_, i) => weekStartDay + i).map((d) => {
              const obj = PROGRAM.find((x) => x.day === d);
              const done = isDayComplete(obj, progressAll[d]);
              const isCurrent = d === currentDay;
              return React.createElement(
                "button",
                {
                  key: d,
                  onClick: () => persistMeta(d),
                  style: {
                    flex: 1,
                    height: 34,
                    borderRadius: 4,
                    cursor: "pointer",
                    border: isCurrent ? "2px solid #EDEAE0" : "2px solid transparent",
                    background: obj?.type === "rest" ? "#2A2920" : done ? "#8FA24C" : "#1F1E17",
                    color: done ? "#14140F" : "#9C978A",
                    fontFamily: "'JetBrains Mono', monospace",
                    fontSize: 11,
                  },
                },
                d
              );
            })
          ),
          React.createElement(
            "div",
            {
              style: {
                background: "#1F1E17",
                border: "2px dashed #4A4832",
                borderRadius: 6,
                padding: "18px 18px 16px",
                marginBottom: 16,
                position: "relative",
              },
            },
            React.createElement("div", { style: { position: "absolute", top: 10, right: 12, width: 8, height: 8, borderRadius: "50%", background: "#4A4832" } }),
            React.createElement(
              "div",
              { style: { fontFamily: "'Oswald', sans-serif", fontSize: 24, letterSpacing: 1, marginBottom: 2 } },
              `DAY ${String(currentDay).padStart(3, "0")}`
            ),
            React.createElement(
              "div",
              { style: { fontSize: 12, color: "#9C978A", marginBottom: 16, fontFamily: "'JetBrains Mono', monospace" } },
              `WEEK ${week} · DAY ${weekDayIndex} OF 7`
            ),
            dayObj?.type === "rest" && React.createElement(
              "div",
              { style: { textAlign: "center", padding: "20px 0", color: "#C1602E", fontFamily: "'Oswald', sans-serif", fontSize: 16, letterSpacing: 1, textTransform: "uppercase" } },
              "Rest Day"
            ),
            dayObj?.type === "train" && React.createElement(
              React.Fragment,
              null,
              React.createElement(RepInput, { label: "Pull-ups", target: dayObj.pull, reps: dayProg.pull, onChange: (r) => setReps("pull", r) }),
              React.createElement(RepInput, { label: "Push-ups", target: dayObj.push, reps: dayProg.push, onChange: (r) => setReps("push", r) }),
              React.createElement(RepInput, { label: "Squats", target: dayObj.squat, reps: dayProg.squat, onChange: (r) => setReps("squat", r) }),
              dayObj.band && React.createElement(RepInput, { label: "Band lat raises", target: dayObj.band, reps: dayProg.band, onChange: (r) => setReps("band", r) })
            ),
            dayObj?.type === "taper" && React.createElement(
              React.Fragment,
              null,
              React.createElement("div", { style: { fontSize: 12, color: "#C1602E", marginBottom: 12, fontFamily: "'JetBrains Mono', monospace" } }, "TAPER — LIGHT EFFORT"),
              React.createElement(RepInput, { label: "Pull-ups", target: dayObj.pull, reps: dayProg.pull, onChange: (r) => setReps("pull", r) }),
              React.createElement(RepInput, { label: "Push-ups", target: dayObj.push, reps: dayProg.push, onChange: (r) => setReps("push", r) }),
              React.createElement(RepInput, { label: "Squats", target: dayObj.squat, reps: dayProg.squat, onChange: (r) => setReps("squat", r) })
            ),
            dayObj?.type === "retest" && React.createElement(
              "div",
              null,
              React.createElement("div", { style: { fontSize: 12, color: "#C1602E", marginBottom: 12, fontFamily: "'JetBrains Mono', monospace" } }, "RETEST DAY — MAX REPS @10KG"),
              dayProg.retestDone ? React.createElement(
                "div",
                { style: { display: "flex", flexDirection: "column", gap: 8 } },
                [["Pull-ups", "retestPull", BASELINE.pull], ["Push-ups", "retestPush", BASELINE.push], ["Squats", "retestSquat", BASELINE.squat]].map(([label, key, base]) =>
                  React.createElement(
                    "div",
                    { key, style: { display: "flex", justifyContent: "space-between", fontFamily: "'JetBrains Mono', monospace", fontSize: 14 } },
                    React.createElement("span", { style: { color: "#9C978A" } }, label),
                    React.createElement(
                      "span",
                      null,
                      dayProg[key],
                      " ",
                      React.createElement("span", { style: { color: dayProg[key] > base ? "#8FA24C" : "#9C978A" } }, `(${dayProg[key] > base ? "+" : ""}${dayProg[key] - base} vs ${base})`)
                    )
                  )
                )
              ) : React.createElement(
                "div",
                { style: { display: "flex", flexDirection: "column", gap: 10 } },
                [["pull", "Pull-ups"], ["push", "Push-ups"], ["squat", "Squats"]].map(([key, label]) =>
                  React.createElement(
                    "div",
                    { key, style: { display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 } },
                    React.createElement("span", { style: { fontSize: 14 } }, label),
                    React.createElement("input", {
                      type: "number",
                      min: "0",
                      value: retestInputs[key],
                      onChange: (e) => setRetestInputs({ ...retestInputs, [key]: e.target.value }),
                      style: {
                        width: 70,
                        background: "#14140F",
                        border: "1px solid #4A4832",
                        borderRadius: 4,
                        color: "#EDEAE0",
                        padding: "6px 8px",
                        fontFamily: "'JetBrains Mono', monospace",
                      },
                    })
                  )
                ),
                React.createElement(
                  "button",
                  {
                    onClick: saveRetest,
                    style: {
                      marginTop: 6,
                      background: "#8FA24C",
                      border: "none",
                      borderRadius: 4,
                      padding: "10px 0",
                      color: "#14140F",
                      fontFamily: "'Oswald', sans-serif",
                      fontSize: 14,
                      letterSpacing: 1,
                      textTransform: "uppercase",
                      cursor: "pointer",
                    },
                  },
                  "Save Retest"
                )
              )
            ),
            React.createElement(
              "div",
              { style: { marginTop: 16, paddingTop: 16, borderTop: "1px solid #4A4832" } },
              React.createElement(
                "div",
                { style: { fontSize: 12, color: "#9C978A", textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 } },
                "Notes"
              ),
              React.createElement("textarea", {
                value: noteInput,
                onChange: (e) => setNoteInput(e.target.value),
                onBlur: saveNote,
                placeholder: "Add a note for this day...",
                style: {
                  width: "100%",
                  minHeight: 60,
                  background: "#14140F",
                  border: "1px solid #4A4832",
                  borderRadius: 4,
                  color: "#EDEAE0",
                  padding: "8px 10px",
                  fontFamily: "'JetBrains Mono', monospace",
                  fontSize: 12,
                  resize: "vertical",
                  boxSizing: "border-box",
                },
              })
            ),
            saveError && React.createElement(
              "div",
              { style: { marginTop: 10, fontSize: 12, color: "#C1602E" } },
              "Couldn't save — try tapping again."
            )
          ),
          React.createElement(
            "div",
            {
              style: {
                background: "#1F1E17",
                border: "2px dashed #4A4832",
                borderRadius: 6,
                padding: "20px",
                marginBottom: 18,
                textAlign: "center",
              },
            },
            React.createElement(
              "div",
              { style: { fontSize: 11, color: "#9C978A", textTransform: "uppercase", letterSpacing: 1, marginBottom: 12 } },
              "Rest Timer (1:30)"
            ),
            React.createElement(
              "div",
              { style: { fontFamily: "'JetBrains Mono', monospace", fontSize: 48, fontWeight: "bold", color: timerSeconds <= 10 ? "#C1602E" : "#8FA24C", marginBottom: 12, letterSpacing: 2 } },
              `${Math.floor(timerSeconds / 60)}:${String(timerSeconds % 60).padStart(2, "0")}`
            ),
            React.createElement(
              "div",
              { style: { display: "flex", gap: 8, justifyContent: "center" } },
              React.createElement(
                "button",
                {
                  onClick: () => setTimerRunning(!timerRunning),
                  style: {
                    background: timerRunning ? "#C1602E" : "#8FA24C",
                    border: "none",
                    borderRadius: 4,
                    padding: "10px 20px",
                    color: "#14140F",
                    fontFamily: "'Oswald', sans-serif",
                    fontSize: 13,
                    letterSpacing: 1,
                    textTransform: "uppercase",
                    cursor: "pointer",
                  },
                },
                timerRunning ? "Pause" : "Start"
              ),
              React.createElement(
                "button",
                {
                  onClick: () => {
                    setTimerSeconds(90);
                    setTimerRunning(false);
                  },
                  style: {
                    background: "none",
                    border: "1px solid #4A4832",
                    borderRadius: 4,
                    padding: "10px 20px",
                    color: "#9C978A",
                    fontFamily: "'Oswald', sans-serif",
                    fontSize: 13,
                    letterSpacing: 1,
                    textTransform: "uppercase",
                    cursor: "pointer",
                  },
                },
                "Reset"
              )
            )
          ),
          React.createElement(
            "div",
            { style: { display: "flex", justifyContent: "space-between", marginBottom: 18 } },
            React.createElement(
              "button",
              {
                onClick: () => persistMeta(Math.max(1, currentDay - 1)),
                disabled: currentDay === 1,
                style: {
                  display: "flex",
                  alignItems: "center",
                  gap: 4,
                  background: "none",
                  border: "1px solid #4A4832",
                  borderRadius: 4,
                  padding: "8px 14px",
                  color: currentDay === 1 ? "#4A4832" : "#EDEAE0",
                  cursor: currentDay === 1 ? "default" : "pointer",
                },
              },
              React.createElement(IconChevronLeft, { size: 16, color: currentDay === 1 ? "#4A4832" : "#EDEAE0" }),
              " Prev"
            ),
            React.createElement(
              "button",
              {
                onClick: () => persistMeta(Math.min(84, currentDay + 1)),
                disabled: currentDay === 84,
                style: {
                  display: "flex",
                  alignItems: "center",
                  gap: 4,
                  background: "none",
                  border: "1px solid #4A4832",
                  borderRadius: 4,
                  padding: "8px 14px",
                  color: currentDay === 84 ? "#4A4832" : "#EDEAE0",
                  cursor: currentDay === 84 ? "default" : "pointer",
                },
              },
              "Next ",
              React.createElement(IconChevronRight, { size: 16, color: currentDay === 84 ? "#4A4832" : "#EDEAE0" })
            )
          ),
          React.createElement(
            "div",
            { style: { display: "flex", gap: 10 } },
            React.createElement(
              "div",
              { style: { flex: 1, background: "#1F1E17", borderRadius: 6, padding: "12px 14px" } },
              React.createElement("div", { style: { fontSize: 11, color: "#9C978A", textTransform: "uppercase", letterSpacing: 1, marginBottom: 4 } }, "Days Done"),
              React.createElement(
                "div",
                { style: { fontFamily: "'JetBrains Mono', monospace", fontSize: 20 } },
                completedTrainDays,
                React.createElement("span", { style: { color: "#9C978A", fontSize: 14 } }, `/${totalTrainDays}`)
              )
            ),
            React.createElement(
              "div",
              { style: { flex: 1, background: "#1F1E17", borderRadius: 6, padding: "12px 14px" } },
              React.createElement(
                "div",
                { style: { fontSize: 11, color: "#9C978A", textTransform: "uppercase", letterSpacing: 1, marginBottom: 4, display: "flex", alignItems: "center", gap: 4 } },
                React.createElement(IconFlame, { size: 12, color: "#C1602E" }),
                " Streak"
              ),
              React.createElement("div", { style: { fontFamily: "'JetBrains Mono', monospace", fontSize: 20 } }, streak)
            )
          ),
          React.createElement(
            "div",
            { style: { marginTop: 18, background: "#1F1E17", borderRadius: 6, padding: "14px 14px 12px" } },
            React.createElement("div", { style: { fontSize: 11, color: "#9C978A", textTransform: "uppercase", letterSpacing: 1, marginBottom: 10 } }, "Program Rules"),
            React.createElement(
              "ul",
              { style: { margin: 0, paddingLeft: 18, display: "flex", flexDirection: "column", gap: 8, color: "#EDEAE0", fontSize: 12, lineHeight: 1.5 } },
              PROGRAM_RULES.map((rule) => React.createElement("li", { key: rule, style: { color: "#EDEAE0" } }, rule))
            )
          )
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(React.createElement(VestTracker));
    </script>
  </body>
</html>
